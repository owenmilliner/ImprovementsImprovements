name: Sync issues to private repository

# One-way mirror: issues and comments in this public repository are copied to
# the private mod source repository. Each run reconciles the whole issue, so a
# dropped or reordered event is corrected by the next one.
# Requires the SYNC_TOKEN secret: a fine-grained PAT limited to the private
# repository with Issues (read and write) permission.
#
# Before syncing, new and edited issues get a project:* label from their
# "Which mod?" answer, so the mirror is labelled with the mod too.

on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, deleted, transferred]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:

permissions: {}

concurrency:
  group: sync-issue-${{ github.event.issue.number || 'backfill' }}
  cancel-in-progress: false

env:
  TARGET_OWNER: owenmilliner
  TARGET_REPO: SubtleImprovements

jobs:
  sync:
    runs-on: ubuntu-latest
    # Only the mod-label step writes to this repository, with the built-in token.
    permissions:
      issues: write
    steps:
      - name: Check SYNC_TOKEN is configured
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::The SYNC_TOKEN secret is not set. See the header of sync-issues.yml."
            exit 1
          fi

      # Issue forms cannot set a label from a dropdown, so read the answer here.
      # Labels added with the built-in token do not trigger another run, so this
      # step tells the sync step below what changed.
      - name: Label the mod from the issue form
        id: mod-label
        if: github.event_name == 'issues' && (github.event.action == 'opened' || github.event.action == 'edited')
        uses: actions/github-script@v7
        with:
          script: |
            const MOD_LABELS = {
              'Subtle Improvements': 'project:si',
              'Not So Subtle Improvements': 'project:nssi',
              'Improvements Core (settings screen, commands, keybind)': 'project:core',
            };
            const issue = context.payload.issue;
            const match = /^### Which mod\?\s*\n+([^\n]+)/m.exec(issue.body || '');
            const answer = match ? match[1].trim() : null;
            // "Not sure", "_No response_" or no form: leave labels to triage.
            if (!answer || !(answer in MOD_LABELS)) return;

            const wanted = MOD_LABELS[answer];
            const current = issue.labels.map((l) => l.name);
            const stale = current.filter((name) => Object.values(MOD_LABELS).includes(name) && name !== wanted);
            const target = { owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number };

            for (const name of stale) {
              await github.rest.issues.removeLabel({ ...target, name });
            }
            if (!current.includes(wanted)) {
              await github.rest.issues.addLabels({ ...target, labels: [wanted] });
            }
            if (stale.length || !current.includes(wanted)) {
              core.setOutput('changed', 'true');
              core.setOutput('removed', stale.join(','));
            }

      - name: Sync to private repository
        uses: actions/github-script@v7
        env:
          MOD_LABEL_CHANGED: ${{ steps.mod-label.outputs.changed }}
          MOD_LABEL_REMOVED: ${{ steps.mod-label.outputs.removed }}
        with:
          github-token: ${{ secrets.SYNC_TOKEN }}
          script: |
            const src = { owner: context.repo.owner, repo: context.repo.repo };
            const dest = { owner: process.env.TARGET_OWNER, repo: process.env.TARGET_REPO };
            const srcKey = `${src.owner}/${src.repo}`;
            const MAX_BODY = 60000;

            const issueMarker = (n) => `<!-- synced-from: ${srcKey}#${n} -->`;
            const commentMarker = (id) => `<!-- synced-comment: ${id} -->`;
            const goneMarker = '<!-- synced-gone -->';
            const clip = (s) => (s || '').length > MAX_BODY ? `${s.slice(0, MAX_BODY)}\n\n...(truncated)` : (s || '');
            // Link text without "@" so mirrored content never pings anyone.
            const userLink = (u) => `[${u.login}](${u.html_url})`;

            const action = context.eventName === 'issues' ? context.payload.action : null;
            const isBackfill = context.eventName === 'workflow_dispatch';

            async function findMirror(number) {
              const marker = issueMarker(number);
              const issues = await github.paginate(github.rest.issues.listForRepo, { ...dest, state: 'all', per_page: 100 });
              return issues.find((i) => !i.pull_request && (i.body || '').includes(marker));
            }

            async function ensureLabels(labels) {
              if (!labels.length) return;
              const existing = await github.paginate(github.rest.issues.listLabelsForRepo, { ...dest, per_page: 100 });
              const names = new Set(existing.map((l) => l.name.toLowerCase()));
              for (const l of labels) {
                if (names.has(l.name.toLowerCase())) continue;
                await github.rest.issues.createLabel({ ...dest, name: l.name, color: l.color, description: l.description || undefined });
              }
            }

            async function markGone(number, reason) {
              const mirror = await findMirror(number);
              if (!mirror) return;
              const comments = await github.paginate(github.rest.issues.listComments, { ...dest, issue_number: mirror.number, per_page: 100 });
              if (!comments.some((c) => (c.body || '').includes(goneMarker))) {
                await github.rest.issues.createComment({ ...dest, issue_number: mirror.number, body: `The original public issue was ${reason}.\n\n${goneMarker}` });
              }
              if (mirror.state === 'open') {
                await github.rest.issues.update({ ...dest, issue_number: mirror.number, state: 'closed', state_reason: 'not_planned' });
              }
            }

            async function syncComments(number, mirrorNumber) {
              const publicComments = await github.paginate(github.rest.issues.listComments, { ...src, issue_number: number, per_page: 100 });
              const mirrored = await github.paginate(github.rest.issues.listComments, { ...dest, issue_number: mirrorNumber, per_page: 100 });
              const byPublicId = new Map();
              for (const c of mirrored) {
                const m = /<!-- synced-comment: (\d+) -->/.exec(c.body || '');
                if (m) byPublicId.set(m[1], c);
              }
              const live = new Set(publicComments.map((c) => String(c.id)));
              for (const c of publicComments) {
                const body = `${userLink(c.user)} commented ([original](${c.html_url})):\n\n${clip(c.body)}\n\n${commentMarker(c.id)}`;
                const existing = byPublicId.get(String(c.id));
                if (!existing) {
                  await github.rest.issues.createComment({ ...dest, issue_number: mirrorNumber, body });
                } else if (existing.body !== body) {
                  await github.rest.issues.updateComment({ ...dest, comment_id: existing.id, body });
                }
              }
              for (const [id, c] of byPublicId) {
                if (!live.has(id)) await github.rest.issues.deleteComment({ ...dest, comment_id: c.id });
              }
            }

            async function reconcile(number) {
              if (action === 'deleted') return markGone(number, 'deleted');
              if (action === 'transferred') return markGone(number, 'transferred to another repository');

              let issue;
              try {
                issue = (await github.rest.issues.get({ ...src, issue_number: number })).data;
              } catch (e) {
                if (e.status === 404) return markGone(number, 'deleted');
                throw e;
              }
              if (issue.pull_request) return;

              const labels = issue.labels.map((l) => (typeof l === 'string' ? { name: l, color: 'ededed' } : l));
              await ensureLabels(labels);

              const title = `[Public #${number}] ${issue.title}`;
              const body = `> Mirrored from ${issue.html_url}, opened by ${userLink(issue.user)}. Changes made here are not synced back.\n\n${clip(issue.body)}\n\n${issueMarker(number)}`;
              const closeReason = issue.state_reason === 'not_planned' ? 'not_planned' : 'completed';

              let mirror = await findMirror(number);
              if (!mirror) {
                mirror = (await github.rest.issues.create({ ...dest, title, body, labels: labels.map((l) => l.name) })).data;
                if (issue.state === 'closed') {
                  await github.rest.issues.update({ ...dest, issue_number: mirror.number, state: 'closed', state_reason: closeReason });
                }
              } else {
                const patch = {};
                if (mirror.title !== title) patch.title = title;
                if (mirror.body !== body) patch.body = body;
                // Only push state on explicit state events so a private-side
                // close is not undone by an unrelated public comment.
                const syncState = isBackfill || ['opened', 'closed', 'reopened'].includes(action);
                if (syncState && issue.state !== mirror.state) {
                  patch.state = issue.state;
                  if (issue.state === 'closed') patch.state_reason = closeReason;
                }
                if (Object.keys(patch).length) {
                  await github.rest.issues.update({ ...dest, issue_number: mirror.number, ...patch });
                }
                if (action === 'unlabeled' && context.payload.label) {
                  try {
                    await github.rest.issues.removeLabel({ ...dest, issue_number: mirror.number, name: context.payload.label.name });
                  } catch (e) {
                    if (e.status !== 404) throw e;
                  }
                } else if (isBackfill || action === 'labeled') {
                  await github.rest.issues.addLabels({ ...dest, issue_number: mirror.number, labels: labels.map((l) => l.name) });
                }
                // The mod-label step changed labels with the built-in token, which
                // starts no labeled/unlabeled run of its own, so apply them here.
                if (process.env.MOD_LABEL_CHANGED === 'true') {
                  await github.rest.issues.addLabels({ ...dest, issue_number: mirror.number, labels: labels.map((l) => l.name) });
                  for (const name of (process.env.MOD_LABEL_REMOVED || '').split(',').filter(Boolean)) {
                    try {
                      await github.rest.issues.removeLabel({ ...dest, issue_number: mirror.number, name });
                    } catch (e) {
                      if (e.status !== 404) throw e;
                    }
                  }
                }
              }

              await syncComments(number, mirror.number);
            }

            if (isBackfill) {
              const all = await github.paginate(github.rest.issues.listForRepo, { ...src, state: 'all', per_page: 100 });
              for (const i of all.filter((x) => !x.pull_request)) await reconcile(i.number);
            } else {
              await reconcile(context.payload.issue.number);
            }
