name: Question
description: Ask how something works or get help using the mod
labels: ["question"]
body:
  - type: dropdown
    id: mod
    attributes:
      label: Which mod?
      description: Usually the mod you installed. Pick Improvements Core for the settings screen, the commands (such as `/si`) or the settings keybind. It comes bundled inside each mod and shows up in your mods list.
      options:
        - Subtle Improvements
        - Not So Subtle Improvements
        - Improvements Core (settings screen, commands, keybind)
        - Not sure
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: Include the feature you're asking about and what you've already tried.
    validations:
      required: true
  - type: input
    id: mod-version
    attributes:
      label: Subtle Improvements version
      placeholder: e.g. 3.4.0
