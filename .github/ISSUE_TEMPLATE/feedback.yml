name: Feedback
description: Share general thoughts on Subtle Improvements
labels: ["feedback"]
body:
  - type: dropdown
    id: mod
    attributes:
      label: Which mod?
      description: Usually the mod you installed. Pick Improvements Core for the settings screen, the commands (such as `/si`) or the settings keybind. It comes bundled inside each mod and shows up in your mods list.
      options:
        - Subtle Improvements
        - Not So Subtle Improvements
        - Improvements Core (settings screen, commands, keybind)
        - Not sure
    validations:
      required: true
  - type: textarea
    id: feedback
    attributes:
      label: Your feedback
      description: What do you like, dislike or think could be smoother?
    validations:
      required: true
  - type: input
    id: mod-version
    attributes:
      label: Subtle Improvements version
      placeholder: e.g. 3.4.0
