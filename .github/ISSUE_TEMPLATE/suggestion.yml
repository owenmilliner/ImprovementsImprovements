name: Suggestion
description: Suggest a new improvement or a change to an existing one
labels: ["suggestion"]
body:
  - type: markdown
    attributes:
      value: |
        **Subtle Improvements** is about small, vanilla-friendly quality-of-life tweaks with no gameplay advantage. Ideas that change how the game plays, such as vein mining or an item magnet, belong in **Not So Subtle Improvements**. Please search existing issues first.
  - type: dropdown
    id: mod
    attributes:
      label: Which mod?
      description: Usually the mod you installed. Pick Improvements Core for the settings screen, the commands (such as `/si`) or the settings keybind. It comes bundled inside each mod and shows up in your mods list.
      options:
        - Subtle Improvements
        - Not So Subtle Improvements
        - Improvements Core (settings screen, commands, keybind)
        - Not sure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What is annoying or repetitive in vanilla Minecraft today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: How should it behave? Mention anything you'd want to configure.
    validations:
      required: true
  - type: textarea
    id: vanilla
    attributes:
      label: Does it fit the mod?
      description: "For Subtle Improvements: why it would fit naturally into Minecraft without a gameplay advantage. For Not So Subtle Improvements: how it stays optional and fair when turned on."
