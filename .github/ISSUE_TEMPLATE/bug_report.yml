name: Bug report
description: Something in Subtle Improvements isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please search existing issues first to avoid duplicates.
  - type: dropdown
    id: mod
    attributes:
      label: Which mod?
      description: Usually the mod you installed. Pick Improvements Core for the settings screen, the commands (such as `/si`) or the settings keybind. It comes bundled inside each mod and shows up in your mods list.
      options:
        - Subtle Improvements
        - Not So Subtle Improvements
        - Improvements Core (settings screen, commands, keybind)
        - Not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Enable the feature ...
        2. Do ...
        3. See ...
    validations:
      required: true
  - type: input
    id: mod-version
    attributes:
      label: Subtle Improvements version
      placeholder: e.g. 3.4.0
    validations:
      required: true
  - type: input
    id: minecraft-version
    attributes:
      label: Minecraft version
      placeholder: e.g. 26.3
    validations:
      required: true
  - type: dropdown
    id: loader
    attributes:
      label: Mod loader
      options:
        - Fabric
        - Forge
        - NeoForge
    validations:
      required: true
  - type: input
    id: other-mods
    attributes:
      label: Other mods installed
      description: Anything that might interact with this mod (or "none").
  - type: textarea
    id: logs
    attributes:
      label: Logs or crash report
      description: Paste the relevant part of `latest.log` or the crash report, or attach the file.
      render: shell
